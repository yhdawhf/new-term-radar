name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face models/Spaces. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Enabled in this fork; pause using Actions > New-term radar > Disable workflow.
# Paid features are explicitly OFF (PAID_ENABLED below), even if a secret exists.
# To enable later, add AISA_API_KEY and change PAID_ENABLED to "true".
# config.github.json is the committed cloud config; config.json remains local.
# Optional secrets after enabling paid features: GOANYAPI_API_KEY, GSC_TOKEN_JSON.
# Schedules below use UTC: sources 00:00/08:00/16:00 and daily 09:30 in Asia/Shanghai.
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over. Every run also backs up the COMPLETE state directory as an artifact.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/radar.yml
      - config.github.json
  schedule:
    - cron: "0 */8 * * *"      # sources
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        description: "daily or sources"
        type: choice
        options:
          - daily
          - sources
        default: "daily"
      test_feishu:
        description: "Only send one Feishu connection test (no data collection)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || ((github.event_name == 'push' || github.event.schedule == '30 1 * * *') && 'daily' || 'sources') }}
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PAID_ENABLED: "false"
      FEISHU_TEST: ${{ inputs.test_feishu && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record trigger details
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          context = {
              "event": os.environ["GITHUB_EVENT_NAME"],
              "cron": os.environ.get("SCHEDULE_CRON", ""),
              "command": os.environ["COMMAND"],
              "started_at": datetime.now(ZoneInfo("Asia/Shanghai")).isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          text = json.dumps(context, ensure_ascii=False, indent=2)
          Path("trigger.json").write_text(text + "\n", encoding="utf-8")
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## 本次触发信息\n\n```json\n" + text + "\n```\n\n")
          PY

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: Test Feishu delivery
        if: env.FEISHU_TEST == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        shell: bash
        run: python -m radar.feishu --test | tee feishu-test.log

      - name: Run the radar
        if: env.FEISHU_TEST != 'true'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        shell: bash
        run: |
          # New-site queries require AIsa; keep them off in this free deployment.
          skip=(newsites)
          if [[ "$PAID_ENABLED" != "true" || -z "$AISA_API_KEY" ]]; then
            skip+=(x judge review usecases revenue asks tutorials sellers builders money sidelights)
            # Also prevent optional keys from activating any paid integration.
            unset AISA_API_KEY GOANYAPI_API_KEY TRUSTMRR_API_KEY
            echo "运行模式：免费信号（Hugging Face 模型/Spaces、GitHub、sitemap、免费新品来源）"
          else
            echo "运行模式：已启用 AIsa 付费功能"
          fi
          case "$COMMAND" in
            daily)
              skip+=(x)
              # Initialise both lists on a fresh state or when upgrading to Spaces support.
              if [[ -f state/hf_top.json.gz && -f state/hf_spaces_top.json.gz ]]; then skip+=(hf); fi
              ;;
            sources) ;;
            *) echo "Unsupported command: $COMMAND" >&2; exit 2 ;;
          esac
          skip_csv=$(IFS=,; echo "${skip[*]}")
          python -m radar "$COMMAND" --config config.github.json --state state \
            --skip "$skip_csv" --out report.md --verbose --log-file run.log

      - name: Publish the report summary
        if: always()
        shell: bash
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FEISHU_TEST" = "true" ]; then
            echo "本次仅验证飞书连接；成功与否见 Test Feishu delivery 步骤及 feishu-test.log。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次没有新名字或没有生成报告；详细过程见 Run the radar 日志及下载的 run.log。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            run.log
            feishu-test.log
            trigger.json
            state/
          if-no-files-found: ignore
          retention-days: 30
